# Builds the Windows player with GameCI.
#   push to main   -> zipped build uploaded as a workflow artifact
#   push tag v*    -> same build, published as a GitHub Release (tag must be on main)
# Required repo secrets: UNITY_LICENSE (contents of Unity_lic.ulf), UNITY_EMAIL, UNITY_PASSWORD.
name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/**']
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: StandaloneWindows64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # LFS objects are cached so each build does not spend the private repo's LFS bandwidth.
      - name: List LFS objects
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS objects
        run: git lfs pull

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            git fetch origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag ${GITHUB_REF_NAME} points to a commit that is not on main."
              exit 1
            fi
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: library-StandaloneWindows64-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: HotPatata
          versioning: Custom
          version: ${{ steps.version.outputs.version }}

      - name: Zip build
        id: zip
        shell: bash
        run: |
          name="HotPatata-Windows-${{ steps.version.outputs.version }}.zip"
          sudo chown -R "$(id -u)" build
          (cd build/StandaloneWindows64 && zip -qr "$GITHUB_WORKSPACE/$name" . -x '*_BurstDebugInformation_DoNotShip/*' '*_BackUpThisFolder_ButDontShipItWithYourGame/*')
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: HotPatata-Windows-${{ steps.version.outputs.version }}
          path: ${{ steps.zip.outputs.file }}
          retention-days: 7

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.file }}
          generate_release_notes: true
